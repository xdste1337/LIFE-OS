</style></head><body><div class="app"><aside class="sidebar"><div class="brand"><span class="logo">L</span> LIFE OS</div><div class="workspace"><span class="ws-dot">✦</span><div><div class="ws-name">Личное пространство</div><div class="ws-sub">Мой workspace　⌄</div></div></div><div class="nav-label">РАБОЧИЙ СТОЛ</div><nav class="nav"><button data-page="overview" class="active"><span class="ico">◫</span>Обзор</button></nav><div class="nav-label">ПРОДУКТИВНОСТЬ</div><nav class="nav"><button data-page="tasks"><span class="ico">☑</span>Задачи <span class="nav-badge" id="taskBadge">0</span></button><button data-page="calendar"><span class="ico">▦</span>Календарь</button><button data-page="inbox"><span class="ico">↳</span>Входящие <span class="nav-badge" id="inboxBadge">0</span></button><button data-page="projects"><span class="ico">◧</span>Проекты</button></nav><div class="nav-label">ЛИЧНОЕ</div><nav class="nav"><button data-page="finance"><span class="ico">◉</span>Финансы</button><button data-page="goals"><span class="ico">◎</span>Цели</button><button data-page="habits"><span class="ico">✳</span>Привычки</button><button data-page="notes"><span class="ico">▤</span>Заметки</button></nav><nav class="nav"><button data-page="analytics"><span class="ico">⌁</span>Аналитика</button><button data-page="settings"><span class="ico">⚙</span>Настройки</button></nav><div class="sidebar-bottom"><div class="profile"><div class="avatar">А</div><div><div class="profile-name" id="profileName">Александр</div><div class="profile-email">Личный аккаунт</div></div></div></div></aside><main class="main"><header class="topbar"><div class="crumb">LIFE OS　/　<b id="crumb">Обзор</b></div><div class="top-actions"><span class="date-pill" id="topDate"></span><button class="icon-btn" id="themeBtn" title="Сменить тему">◐</button><button class="icon-btn" id="notifyBtn" title="Уведомления">♧</button></div></header><div class="content" id="content"></div></main></div><nav class="mobile-menu" id="mobileNav"></nav><div id="overlay"></div><script>
const seed={tasks:[{id:1,title:'Подготовить презентацию проекта',due:'Сегодня · 14:00',priority:'Высокий',done:false},{id:2,title:'Забронировать столик на субботу',due:'Сегодня · 18:00',priority:'Средний',done:false},{id:3,title:'Проверить счета за октябрь',due:'Сегодня',priority:'Низкий',done:true}],events:[{time:'10:30',name:'Планирование недели',place:'Календарь · 30 мин'},{time:'13:00',name:'Обед с командой',place:'Кофейня «Мята» · 1 час'},{time:'16:30',name:'Зал — тренировка',place:'Личное · 1 час'}],habits:[{name:'Утренняя зарядка',emoji:'🧘',count:1,target:1,done:true},{name:'Читать 30 минут',emoji:'📖',count:0,target:1,done:false},{name:'Выпить 2 л воды',emoji:'💧',count:1.2,target:2,done:false}],goals:[{name:'Подушка безопасности',sub:'Финансы · до 31 дек.',pct:68},{name:'Прочитать 20 книг',sub:'Образование · до 31 дек.',pct:40}],projects:[{name:'Запуск LIFE OS',desc:'Личная система управления',status:'В работе',pct:62},{name:'Здоровье и энергия',desc:'Режим, тренировки, питание',status:'В работе',pct:35}],notes:[{title:'Идеи на ноябрь',body:'Новый режим, больше времени на чтение и мини-путешествие.',date:'Сегодня'},{title:'Книги для чтения',body:'Список книг по продукту, дизайну и эффективности.',date:'Вчера'}],inbox:[{text:'Идея: вести дневник благодарности',type:'Идея'},{text:'Купить фильтр для воды',type:'Покупка'}],transactions:[{title:'Продукты',category:'Еда',amount:-2450,date:'Сегодня'},{title:'Зарплата',category:'Доход',amount:85000,date:'1 ноя'},{title:'Кофе с собой',category:'Кафе',amount:-420,date:'Вчера'}],expenses:12450};let data;try{data=JSON.parse(localStorage.lifeosData)}catch{}if(!data)data=seed;let page='overview';const pages={overview:'Обзор',tasks:'Задачи',calendar:'Календарь',inbox:'Входящие',projects:'Проекты',finance:'Финансы',goals:'Цели',habits:'Привычки',notes:'Заметки',analytics:'Аналитика',settings:'Настройки'};const icons={overview:'◫',tasks:'☑',calendar:'▦',inbox:'↳',projects:'◧',finance:'◉',goals:'◎',habits:'✳',notes:'▤',analytics:'⌁',settings:'⚙'};const $=s=>document.querySelector(s);function save(){localStorage.lifeosData=JSON.stringify(data);render()}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function dateRu(){return new Intl.DateTimeFormat('ru-RU',{weekday:'long',day:'numeric',month:'long'}).format(new Date())}function toast(msg){let el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.append(el);setTimeout(()=>el.remove(),2300)}function taskRows(limit=99){return data.tasks.length?data.tasks.slice(0,limit).map(t=>`<div class="task-row"><button class="check ${t.done?'done':''}" data-check="${t.id}">${t.done?'✓':''}</button><div style="flex:1"><div class="task-text ${t.done?'is-done':''}">${esc(t.title)}</div><div class="task-meta">${esc(t.due||'Без срока')}</div></div><span class="tag ${t.priority==='Высокий'?'red':t.priority==='Средний'?'orange':''}">${esc(t.priority||'Обычный')}</span></div>`).join(''):'<div class="empty">Пока нет задач. Добавь первую ☺</div>'}function habitRows(){return data.habits.map((h,i)=>`<div class="habit"><span class="habit-emoji">${h.emoji||'✳'}</span><span class="habit-name">${esc(h.name)}</span><span class="habit-count">${h.count??0} / ${h.target??1}</span><button class="habit-done" data-habit="${i}">${h.done?'✓':'+'}</button></div>`).join('')||'<div class="empty">Добавь первую привычку</div>'}function goalCards(){return data.goals.map(g=>`<div class="goal-card"><div class="goal-row"><b>${esc(g.name)}</b><span class="goal-pct">${g.pct}%</span></div><div class="goal-sub">${esc(g.sub||'Личная цель')}</div><div class="progress-line"><span style="width:${g.pct}%"></span></div></div>`).join('')||'<div class="empty">Целей пока нет</div>'}
function taskPage(){return `<div class="welcome-row"><div><div class="eyebrow">ПРОДУКТИВНОСТЬ</div><h1 class="section-title">Задачи</h1><div class="section-desc">От небольших дел до больших планов — всё под контролем.</div></div><button class="primary" data-add="task">＋ Новая задача</button></div><section class="panel"><div class="panel-head"><div class="panel-title">Все задачи · ${data.tasks.length}</div><select class="filter" id="taskFilter"><option>Все статусы</option><option>Активные</option><option>Выполненные</option></select></div><div id="taskList">${taskRows()}</div></section>`}
function calendarPage(){let now=new Date(),first=(new Date(now.getFullYear(),now.getMonth(),1).getDay()+6)%7,days=new Date(now.getFullYear(),now.getMonth()+1,0).getDate(),cells=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>`<div class="dow">${x}</div>`).join('');for(let i=0;i<first;i++)cells+='<div></div>';for(let d=1;d<=days;d++)cells+=`<div class="${d===now.getDate()?'today':''}">${d}</div>`;return `<div class="welcome-row"><div><div class="eyebrow">ПЛАНИРОВАНИЕ</div><h1 class="section-title">Календарь</h1><div class="section-desc">Время, которое ты выбираешь для важного.</div></div><button class="primary" data-add="event">＋ Событие</button></div><div class="layout"><section class="panel"><div class="panel-head"><b>${new Intl.DateTimeFormat('ru-RU',{month:'long',year:'numeric'}).format(now)}</b><span class="tag">Месяц　Неделя　День</span></div><div class="calendar">${cells}</div></section><section class="panel"><div class="panel-head"><div class="panel-title">Расписание на сегодня</div></div>${data.events.map(e=>`<div class="event"><div class="event-time">${esc(e.time)}</div><div class="event-mark"></div><div><div class="event-name">${esc(e.name)}</div><div class="event-place">${esc(e.place||'')}</div></div></div>`).join('')||'<div class="empty">Свободный день 🌱</div>'}</section></div>`}
function rows(arr,type){return arr.map((x,i)=>`<div class="task-row"><div style="flex:1"><div class="task-text">${esc(x.title||x.name||x.text)}</div><div class="task-meta">${esc(x.desc||x.sub||x.body||x.type||x.category||x.date||'')}</div></div>${type==='goal'?`<span class="tag green">${x.pct}%</span>`:type==='project'?`<span class="tag green">${esc(x.status||'В работе')}</span>`:type==='transaction'?`<span class="tag ${x.amount<0?'orange':'green'}">${Number(x.amount).toLocaleString('ru-RU')} ₽</span>`:type==='inbox'?`<select data-inbox="${i}" class="filter"><option>${esc(x.type)}</option><option>Задача</option><option>Заметка</option><option>Событие</option><option>Расход</option><option>Покупка</option><option>Идея</option><option>Готово</option></select>`:'<span class="tag">Запись</span>'}</div>`).join('')||'<div class="empty">Здесь пока пусто — добавь первую запись</div>'}

{e.preventDefault();let f=new FormData(e.target),title=f.get('title').trim(),x=f.get('extra');if(kind==='task')data.tasks.unshift({id:Date.now(),title,due:'Сегодня',priority:x,done:false});if(kind==='event')data.events.push({time:x||'Весь день',name:title,place:'Личный календарь'});if(['quick','inbox'].includes(kind))data.inbox.unshift({text:title,type:x});if(kind==='project')data.projects.push({name:title,desc:x,status:'В работе',pct:0});if(kind==='goal')data.goals.push({name:title,sub:x||'Личная цель',pct:0});if(kind==='habit')data.habits.push({name:title,emoji:'✳',count:0,target:Number(x)||1,done:false});if(kind==='note')data.notes.unshift({title,body:x||'',date:'Сегодня'});if(kind==='transaction'){let n=Number(x)||0;data.transactions.unshift({title,category:'Другое',amount:n,date:'Сегодня'});if(n<0)data.expenses=(data.expenses||0)+Math.abs(n)}$('#overlay').innerHTML='';save();toast(c[3])}}
document.addEventListener('click',e=>{let p=e.target.closest('[data-page]');if(p){page=p.dataset.page;render();return}let g=e.target.closest('[data-go]');if(g){page=g.dataset.go;render();return}let a=e.target.closest('[data-add]');if(a){openModal(a.dataset.add);return}let c=e.target.closest('[data-check]');if(c){let t=data.tasks.find(t=>t.id==c.dataset.check);if(t)t.done=!t.done;save();return}let h=e.target.closest('[data-habit]');if(h){let x=data.habits[h.dataset.habit];x.done=!x.done;x.count=x.done?x.target:0;save();return}if(e.target.id==='quickAdd'){let input=$('#quickInput');if(input?.value.trim()){data.inbox.unshift({text:input.value.trim(),type:'Идея'});save();toast('Добавлено во входящие')}}if(e.target.id==='themeBtn'||e.target.id==='toggleTheme'){localStorage.lifeosTheme=localStorage.lifeosTheme==='light'?'dark':'light';render()}if(e.target.id==='notifyBtn')toast('Ты в курсе всех важных дел ✨');if(e.target.id==='saveName'){localStorage.lifeosName=$('#nameInput').value.trim()||'Александр';render();toast('Профиль сохранён')}if(e.target.id==='exportData'){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='life-os-data.json';a.click();URL.revokeObjectURL(a.href)}});

function editRecord(type,index){let key=recordSets[type],item=data[key]?.[index];if(!item)return;let name=item.title||item.name||item.text||'',body=item.body||item.desc||item.sub||item.place||'',extra=type==='task'?item.priority||'Средний':type==='event'?item.time||'':type==='habit'?item.target||1:type==='inbox'?item.type||'Идея':type==='transaction'?item.amount||0:body;openModal(type);let form=$('#modalForm');form.elements.title.value=name;form.elements.extra.value=extra;form.onsubmit=e=>{e.preventDefault();let f=new FormData(form),title=f.get('title').trim(),x=f.get('extra');if(type==='task'){item.title=title;item.priority=x}else if(type==='event'){item.name=title;item.time=x}else if(type==='project'){item.name=title;item.desc=x}else if(type==='goal'){item.name=title;item.sub=x}else if(type==='habit'){item.name=title;item.target=Number(x)||1;item.count=Math.min(item.count,item.target)}else if(type==='note'){item.title=title;item.body=x}else if(type==='inbox'){item.text=title;item.type=x}else if(type==='transaction'){item.title=title;item.amount=Number(x)||0}$('#overlay').innerHTML='';save();toast(`${recordNames[type]} обновлена`)}}

const financePanelsBeforePeriod=financePanels;financePanels=function(){financePanelsBeforePeriod();let add=$('#content .welcome-row [data-add="transaction"]');if(add&&!$('#financePeriod'))add.insertAdjacentHTML('beforebegin','<select id="financePeriod" class="filter" aria-label="Период отчёта"><option value="month">Этот месяц</option><option value="year">Этот год</option><option value="all">За всё время</option></select>');let select=$('#financePeriod');if(select)select.value=financePeriod;let grouped={};for(let t of transactionsInPeriod()){let c=t.currency||'RUB';grouped[c]??={income:0,expenses:0};let amount=Number(t.amount)||0;if(amount<0)grouped[c].expenses+=Math.abs(amount);else grouped[c].income+=amount}if(!Object.keys(grouped).length)grouped.RUB={income:0,expenses:0};let cards=Object.entries(grouped).map(([c,v])=>`<div class="card"><div class="stat-top">Расходы · ${c}</div><div class="stat-value">${money(v.expenses,c)}</div><div class="stat-foot">Доходы: <span>${money(v.income,c)}</span></div></div>`).join('');$('#content .cards').innerHTML=cards;let report=$$('#content .panel').find(p=>p.querySelector('.panel-title')?.textContent.includes('Расходы по категориям'));if(report){report.querySelectorAll('.task-row,.empty').forEach(x=>x.remove());let sums={};for(let t of transactionsInPeriod().filter(t=>Number(t.amount)<0)){let key=(t.currency||'RUB')+'|'+(t.category||'Другое');sums[key]=(sums[key]||0)+Math.abs(Number(t.amount))}let lines=Object.entries(sums).sort((a,b)=>b[1]-a[1]).map(([key,value])=>{let [c,name]=key.split('|');return `<div class="task-row"><span class="task-text">${esc(name)}</span><span class="tag orange">${money(value,c)}</span></div>`}).join('')||'<div class="empty">За этот период расходов нет</div>';report.querySelector('.panel-head').insertAdjacentHTML('afterend',lines)}};

(function(){const config=window.LIFE_OS_SUPABASE;if(!config||!window.supabase?.createClient)return;const client=window.supabase.createClient(config.url,config.publishableKey);window.lifeOsSupabase=client;let session=null,mode='signin';const actions=document.querySelector('.top-actions');const authButton=document.createElement('button');authButton.id='authButton';authButton.className='secondary';authButton.textContent='Войти';actions?.prepend(authButton);const style=document.createElement('style');style.textContent='.auth-message{min-height:18px;color:var(--muted);font-size:11px;line-height:1.5}.auth-note{font-size:10px;color:var(--muted);line-height:1.5;margin-top:10px}.auth-switch{background:none;border:0;color:var(--green2);font-size:11px;padding:8px 0}.auth-email{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}@media(max-width:720px){#authButton{font-size:0;padding:8px 10px}#authButton::after{content:"↗";font-size:13px}}';document.head.append(style);function setUserUi(){const user=session?.user,name=user?.user_metadata?.display_name||user?.email?.split('@')[0]||localStorage.lifeosName||'Александр',profile=document.querySelector('#profileName');if(profile)profile.textContent=name;authButton.textContent=user?'Выйти':'Войти';authButton.title=user?.email||'Войти или создать аккаунт';authButton.classList.toggle('auth-email',!!user)}function showAuth(){mode='signin';drawAuth()}function drawAuth(message=''){const isSignup=mode==='signup';document.querySelector('#overlay').innerHTML=`<div class="modal-backdrop" id="authBackdrop"><form class="modal" id="authForm"><h2>${isSignup?'Создать аккаунт':'Войти в LIFE OS'}</h2>${isSignup?'<div class="field"><label>Имя</label><input name="name" autocomplete="name" required></div>':''}<div class="field"><label>Email</label><input name="email" type="email" autocomplete="email" required></div><div class="field"><label>Пароль</label><input name="password" type="password" autocomplete="${isSignup?'new-password':'current-password'}" minlength="8" required></div><div class="auth-message" id="authMessage">${esc(message)}</div><div class="modal-actions"><button type="button" class="secondary" id="closeAuth">Закрыть</button><button class="primary" id="authSubmit">${isSignup?'Зарегистрироваться':'Войти'}</button></div><button type="button" class="auth-switch" id="authSwitch">${isSignup?'Уже есть аккаунт? Войти':'Нет аккаунта? Зарегистрироваться'}</button><div class="auth-note">После входа данные можно будет синхронизировать с облаком, когда миграция LIFE OS будет применена в Supabase.</div></form></div>`;document.querySelector('#closeAuth').onclick=()=>document.querySelector('#overlay').innerHTML='';document.querySelector('#authBackdrop').onclick=e=>{if(e.target.id==='authBackdrop')document.querySelector('#overlay').innerHTML=''};document.querySelector('#authSwitch').onclick=()=>{mode=isSignup?'signin':'signup';drawAuth()};document.querySelector('#authForm').onsubmit=async e=>{e.preventDefault();const form=e.currentTarget,f=new FormData(form),email=String(f.get('email')).trim(),password=String(f.get('password')),submit=document.querySelector('#authSubmit'),msg=document.querySelector('#authMessage');submit.disabled=true;submit.textContent='Подключаем…';try{if(isSignup){const {data,error}=await client.auth.signUp({email,password,options:{data:{display_name:String(f.get('name')).trim()},emailRedirectTo:'https://xdste1337.github.io/LIFE-OS/'}});if(error)throw error;if(!data.session){drawAuth('Проверь почту и подтверди адрес, затем войди в приложение.');return}document.querySelector('#overlay').innerHTML='';toast('Аккаунт создан')}else{const {error}=await client.auth.signInWithPassword({email,password});if(error)throw error;document.querySelector('#overlay').innerHTML='';toast('Вход выполнен')}}catch(err){const current=document.querySelector('#authMessage');if(current)current.textContent=err.message||'Не удалось выполнить вход'}finally{const current=document.querySelector('#authSubmit');if(current){current.disabled=false;current.textContent=mode==='signup'?'Зарегистрироваться':'Войти'}}};}authButton.addEventListener('click',async()=>{if(session){const {error}=await client.auth.signOut();if(error)toast('Не удалось выйти');return}showAuth()});client.auth.onAuthStateChange((_event,next)=>{session=next;setUserUi()});client.auth.getSession().then(({data})=>{session=data.session;setUserUi()})})();
